# edit.phext.io — nginx site for phext-edit.
#
# deploy/deploy.sh installs this file. It is the only supported way to put
# it on a host. See deploy/deploy.md for the managed-file marker, the
# PHEXT_NGINX_FORCE latch, and what a run changes.
#
# On Debian/Ubuntu this file is included from the http block, so the
# limit_req_zone lines belong here and the file must not be wrapped in
# another http { }.
#
# phext-edit itself sets Cache-Control, ETag, CSP, X-Content-Type-Options,
# X-Frame-Options, Referrer-Policy, and Permissions-Policy, and sets HSTS
# when X-Forwarded-Proto is https. This file is what nginx has to do itself:
# hide its version, redirect port 80, rate-limit sign-in, and send one HSTS
# header. deploy.sh substitutes the domain (edit.phext.io) and the upstream
# port (127.0.0.1:8080) from DOMAIN and PORT, keeps ssl_certificate paths
# already present on the host, and drops ssl_dhparam when that file is absent.
#
# The in-app limiter (20 rejected sign-in attempts per address per 10 minutes)
# covers /api/auth/* and a wrong bearer token. nginx is the outer cap: 1
# request/second, burst 20, on /api/auth/ and on /api/status (the token box
# checks the secret with GET /api/status). The limiter trusts X-Real-IP,
# which this file sets from $remote_addr. A client-supplied X-Forwarded-For
# is not the address that is counted while X-Real-IP is present.

limit_req_zone $binary_remote_addr zone=phext_edit_req:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=phext_auth:10m rate=1r/s;

# Port 80 only redirects. Do not proxy_pass here.
server {
    listen 80;
    listen [::]:80;
    server_name edit.phext.io;
    server_tokens off;
    return 301 https://edit.phext.io$request_uri;
}

server {
    # `http2` on listen works through nginx 1.24. On 1.25+ it warns; if
    # `nginx -t` complains, use `listen 443 ssl;` plus `http2 on;` instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edit.phext.io;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/edit.phext.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edit.phext.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 16M;

    # The app sends the same value when it sees X-Forwarded-Proto https.
    # Drop that copy so the browser sees one header.
    # Do not add add_header inside the locations below: a location that sets
    # any add_header stops inheriting this one.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/auth/ {
        limit_req zone=phext_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Token sign-in is GET /api/status with Authorization: Bearer.
    location = /api/status {
        limit_req zone=phext_auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=phext_edit_req burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
