[package]
name = "lattice-ui"
description = "Web-served phext editor — mmap-backed, browser-rendered"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "phext-edit"
path = "src/main.rs"

[dependencies]
lattice-core = { path = "../lattice-core", version = "0.1.0" }
libphext.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
