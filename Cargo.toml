[package]
name = "phext-lattice"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Will Bickford <wbic16@gmail.com>"]
description = "Memory-mapped 9D phext lattice with O(1) coordinate lookup, sentron topology, and web/TUI editors"
repository = "https://github.com/wbic16/phext-lattice"
keywords = ["phext", "lattice", "editor", "11d", "text"]
categories = ["text-editors", "command-line-utilities"]

[features]
default = ["web"]
web = ["dep:serde", "dep:serde_json"]
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
libphext = "0.3"
memmap2 = "0.9"
rayon = "1.10"
tempfile = "3"

# Web UI deps (default)
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# TUI deps
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "phext-edit"
path = "src/bin/phext_edit.rs"
required-features = ["web"]

[[bin]]
name = "phext-nav"
path = "src/bin/phext_nav.rs"
required-features = ["tui"]

[[bin]]
name = "phext-tts"
path = "src/bin/phext_tts.rs"

[[bench]]
name = "lattice_bench"
harness = false
